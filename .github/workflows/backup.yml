name: Nightly database backup

# A logical dump of the production database, encrypted and copied to a separate private bucket, in
# addition to the managed database's own point-in-time recovery. Needs the repository secrets below
# (docs/HANDOVER.md). Set a lifecycle rule on the bucket to delete dumps after 35 days.
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PGURL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
    steps:
      - name: Install the PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Dump, encrypt, upload
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump --format=custom --no-owner --no-privileges "$PGURL" --file "gik-$stamp.dump"
          test -s "gik-$stamp.dump"
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASSPHRASE -in "gik-$stamp.dump" -out "gik-$stamp.dump.enc"
          aws s3 cp "gik-$stamp.dump.enc" "s3://$S3_BUCKET/backups/gik-$stamp.dump.enc" --endpoint-url "$S3_ENDPOINT"
          echo "Uploaded backups/gik-$stamp.dump.enc ($(stat -c %s "gik-$stamp.dump.enc") bytes)"
