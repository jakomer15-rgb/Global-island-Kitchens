name: Automation timer

# Calls the scheduled job (/api/cron/outbox) every 10 minutes so emails, retries, scheduled social posts and the
# automation workflows run on time. Vercel's Hobby plan only runs it once a day; this is the free alternative to
# a paid plan or an n8n timer (docs/DEPLOYMENT.md, "Workflows"). Needs two repository secrets:
#   SITE_URL     the live address, e.g. https://www.example.com (no trailing slash)
#   CRON_SECRET  the same value as CRON_SECRET in Vercel
# Without them the run skips quietly instead of failing. GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: automation-timer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call the scheduled job
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "SITE_URL or CRON_SECRET is not set; skipping."
            exit 0
          fi
          # The response body is not printed: run logs can be public. Results are in Automation Centre → Workflows.
          status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" "${SITE_URL%/}/api/cron/outbox")
          echo "HTTP $status"
          test "$status" = "200"
