name: CI

on:
  pull_request:
  push:
    branches: [main, fresh-start]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gik
          POSTGRES_PASSWORD: gik
          POSTGRES_DB: gik_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gik" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway values for CI only.
      DATABASE_URL: postgresql://gik:gik@localhost:5432/gik_test
      DATABASE_URL_TEST: postgresql://gik:gik@localhost:5432/gik_test
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      BETTER_AUTH_URL: http://localhost:3100
      IP_HASH_SECRET: ci-only-ip-hash-secret-ci-only-ip-hash-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
