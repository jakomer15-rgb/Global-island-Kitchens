name: Restore rehearsal

# Proves a backup can be restored. Run it by hand after the first backup and then every few months:
# it restores the newest (or a named) dump into a throwaway PostgreSQL and checks that the data,
# migration history, triggers and sequences came back. Nothing touches production.
on:
  workflow_dispatch:
    inputs:
      key:
        description: "Backup object to restore (blank = newest)"
        required: false

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gik
          POSTGRES_PASSWORD: gik
          POSTGRES_DB: gik_restore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gik" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      DATABASE_URL: postgresql://gik:gik@localhost:5432/gik_restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Download, decrypt, restore
        run: |
          set -euo pipefail
          key="${{ github.event.inputs.key }}"
          if [ -z "$key" ]; then
            key=$(aws s3api list-objects-v2 --bucket "$S3_BUCKET" --prefix backups/ --endpoint-url "$S3_ENDPOINT" \
              --query 'sort_by(Contents,&LastModified)[-1].Key' --output text)
          fi
          echo "Restoring $key"
          aws s3 cp "s3://$S3_BUCKET/$key" backup.dump.enc --endpoint-url "$S3_ENDPOINT"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:BACKUP_PASSPHRASE -in backup.dump.enc -out backup.dump
          pg_restore --no-owner --no-privileges --dbname "$DATABASE_URL" backup.dump
      - name: Check the restored database
        run: npm run restore:verify
